[project]
name = "grabette-chunkrel"
version = "0.1.0"
description = "Chunk-relative action representation for Grabette policies: the maths plus its LeRobot processor steps."
requires-python = ">=3.11"

# DELIBERATELY MINIMAL. This package is installed into environments that already
# provide torch and lerobot — the HF Jobs training container, the Ficelle
# inference server, the eval loop — and it must not fight them for a version.
#
# `grabette-postprocess` pins `lerobot[dataset,viz]==0.6.0` while the pi05
# training script pins `lerobot @ git+...@<rev>`; declaring lerobot here would
# reproduce that URL-vs-version conflict inside the job, i.e. after the GPU has
# already booted. So lerobot and torch are treated as HOST-PROVIDED: imported by
# `chunk_relative_processor`, never declared. `chunk_relative` itself needs only
# numpy and scipy and imports neither.
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
# For running this package's own tests, which exercise the processor steps.
# lerobot carries the same `>= 3.12` marker as everywhere else in the workspace:
# it declares Python>=3.12, and an unguarded pin here makes `uv lock` fail for
# the whole workspace on the 3.11 split.
test = ["pytest", "torch", "lerobot==0.6.0 ; python_version >= '3.12'"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["grabette_chunkrel"]
