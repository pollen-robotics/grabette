syntax = "proto3";
package gripette;

service GripperService {
  // Server-streaming: 10Hz camera frames + motor positions
  rpc StreamState (StreamRequest) returns (stream GripperFrame);
  // Unary: send goal positions to motors
  rpc SendMotorCommand (MotorCommand) returns (MotorCommandResponse);
  // Unary: read motor positions (lightweight, no camera)
  rpc ReadMotors (ReadMotorsRequest) returns (MotorState);
  // Unary: enable/disable motor torque
  rpc SetTorque (TorqueCommand) returns (TorqueResponse);
  // Unary: health check
  rpc Ping (PingRequest) returns (PingResponse);
  // Unary: zero calibration only. Re-centre each servo's own zero (EEPROM
  // offset) on the current pose, which must be fully open, so the closing
  // travel never crosses the encoder's 0/4095 seam. Turns torque off. The
  // GRIPPER_MOTOR*_OFFSET values must be recalibrated right after and the
  // service restarted; until then goals and torque-on are refused.
  rpc CenterServos (CenterServosRequest) returns (CenterServosResponse);
}

message CenterServosRequest {}

message CenterServosResponse {
  bool success = 1;
  string error = 2;
  bool changed = 3;                    // false: already centred, nothing written
  repeated int32 old_offset_steps = 4; // per motor, servo offset before
  repeated int32 new_offset_steps = 5; // per motor, servo offset after
}

message StreamRequest {}

message GripperFrame {
  bytes jpeg_data = 1;
  MotorState motor_state = 2;
  double timestamp_ms = 3;       // monotonic, ms since server start
  uint64 sequence = 4;
}

message MotorState {
  float motor1_position = 1;     // radians
  float motor2_position = 2;     // radians
  float motor1_load = 3;         // decoded present_load (signed effort, ~PWM)
  float motor2_load = 4;         // decoded present_load (signed effort, ~PWM)
}

message MotorCommand {
  float motor1_goal = 1;         // radians
  float motor2_goal = 2;         // radians
  // Running torque limit, fraction 0..1 of max torque. 0 = unset = full
  // torque (backward-compatible default; identical to pre-torque-limit behavior).
  float motor1_torque_limit = 3;
  float motor2_torque_limit = 4;
}

message MotorCommandResponse {
  bool success = 1;
  string error = 2;
}

message TorqueCommand {
  bool enable = 1;
}

message TorqueResponse {
  bool success = 1;
  string error = 2;
}

message ReadMotorsRequest {}

message PingRequest {}

message PingResponse {
  string status = 1;
  double uptime_seconds = 2;
}
