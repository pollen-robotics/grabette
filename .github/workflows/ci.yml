name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Ruff
        # Config in the root pyproject.toml ([tool.ruff]): pyflakes +
        # pycodestyle E4/E7/E9, explicitly selected; proto stubs excluded.
        # VERSION PINNED ON PURPOSE. `uvx ruff` floats to the latest release,
        # which silently changes the gate: ruff 0.16 widened the default rule
        # set and every PR started failing on untouched files. Bump this
        # deliberately, with the resulting diff reviewed — not by surprise.
        run: uvx ruff@0.16.0 check packages integrations

  workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Install system dependencies
        # python-prctl (required by picamera2) has only a source distribution.
        # uv lock --check rebuilds it from the sdist on a cold cache, which
        # needs the libcap development headers.
        run: sudo apt-get install -y libcap-dev

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Lock is up to date
        run: uv lock --check

      - name: Build the full workspace environment
        # Resolves and installs every member on a clean machine — the real
        # gate that the single workspace lock works end to end.
        run: uv sync --all-packages

      - name: Import smoke test
        # The core services + postprocess + model import with no exotic system
        # libs. The OpenArm sim is validated by the build step above; importing
        # it at runtime additionally needs system urdfdom (placo) — left to a
        # follow-up CI step. Linting (ruff) is also a follow-up: no config yet.
        run: |
          uv run python - <<'PY'
          import importlib, sys
          mods = ["grabette", "casquette", "gripette",
                  "grabette_postprocess", "openarm_gripette_model"]
          failed = []
          for m in mods:
              try:
                  importlib.import_module(m)
                  print(f"OK   {m}")
              except Exception as e:
                  print(f"FAIL {m}: {type(e).__name__}: {e}")
                  failed.append(m)
          sys.exit(1 if failed else 0)
          PY

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Device-package unit tests
        # Behavioural regression tests (grabette SessionManager, ...), run
        # against a temp-dir/mock path — no hardware. Extend per package.
        #
        # --extra hf installs the fleet/HF feature set (aiohttp, huggingface-hub).
        # It is optional at RUNTIME — a grabette with no fleet doesn't need it —
        # but the group start/stop tests exercise exactly that code, and
        # relay_client imports aiohttp at module level. The alternative, putting a
        # runtime library in the `test` extra, would blur what that extra means:
        # test tooling, installed on top of the feature set under test.
        #
        # --extra vision installs opencv-python-headless for the same reason:
        # grabette.hardware.oakd imports cv2 at module level, so without it
        # test_hardware_error.py cannot even be COLLECTED — and a collection
        # error fails the whole run, not just that file. It lives in its own
        # extra rather than in `rpi`, which is unusable off a Pi (picamera2,
        # depthai, gpiod) and so can never be installed here.
        run: uv run --package grabette --extra test --extra hf --extra vision pytest packages/grabette/tests -q

      - name: Attention-diagnostics unit tests
        # 170 tests: records, layout, token reduction, the ablation and
        # occlusion metrics, prompt sensitivity, both front ends, and the CLI.
        # All run against fake adapters — no checkpoint, no GPU. The one test
        # that needs real weights carries the `gpu` marker and the package's
        # own addopts (-m 'not gpu') deselects it.
        #
        # A hand-built venv rather than `--extra test`, on purpose. That extra
        # declares torch and lerobot[pi] so the GPU test can load a real pi0.5
        # by hand; in CI it would pull the CUDA torch wheel and transformers —
        # several GB — for a test that is deselected anyway. These five
        # packages are what the 170 actually need, verified by running them in
        # exactly this environment:
        #   torch  two test files import it at module scope for the
        #          forward-hook stubs, and a collection error fails the whole
        #          run, so it cannot simply be skipped.
        #   cv2    the dump_obs BGR->RGB test is cv2-gated and would silently
        #          skip without it.
        #   lerobot is NOT needed: the adapter and CLI tests inject fakes.
        run: |
          uv venv .venv-attn --python 3.12
          VIRTUAL_ENV=.venv-attn uv pip install --torch-backend=cpu \
            torch pytest numpy matplotlib opencv-python-headless
          VIRTUAL_ENV=.venv-attn uv pip install --no-deps ./packages/grabette-attention
          .venv-attn/bin/python -m pytest packages/grabette-attention/tests -q

      - name: Postprocess unit tests
        # Trajectory math + SLAM-quality / recording checks + episode tags.
        # Pure Python (numpy/scipy/pandas/av), no Docker/SLAM. lerobot (torch)
        # is skipped: the __init__ is empty so these modules don't import it,
        # and leaving it out keeps the job fast. The lerobot-dependent tests in
        # this dir self-skip here (pytest.importorskip) and run in the 'lerobot'
        # job below.
        run: |
          uv sync --package grabette-postprocess --extra test --no-install-package lerobot
          uv run --no-sync --package grabette-postprocess pytest packages/grabette-postprocess/tests -q

  lerobot:
    # Guards the lerobot boundary so a dependency bump can't silently regress it
    # (e.g. the vcodec->rgb_encoder break). Runs the tests that need lerobot
    # actually installed — Tier A API-surface tripwires + Tier B synthetic
    # build_dataset round-trip — which the fast 'tests' job skips via
    # pytest.importorskip("lerobot").
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install FFmpeg
        # lerobot[dataset]'s video path uses torchcodec, which dlopens the system
        # FFmpeg libraries (libavutil.so.* / libavcodec.so.* …) at runtime. A bare
        # ubuntu-latest runner has none, so build_dataset fails at video encode.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lerobot-dependent tests (CPU torch)
        # CPU-only torch via `uv pip install --torch-backend=cpu` (~200 MB); a
        # plain workspace sync installs the CUDA wheel (~2.5 GB) — the tests use
        # no GPU. The lerobot spec is read from the postprocess pyproject so the
        # tested version tracks the pin automatically (no drift). cv2 comes from
        # lerobot's opencv-python-headless — all the tests need (no GUI); no
        # separate opencv-python.
        run: |
          SPEC=$(grep -oE "lerobot\[[a-z,]*\]==[0-9.]+" packages/grabette-postprocess/pyproject.toml | head -1)
          echo "Testing against: $SPEC"
          uv venv .venv-lerobot --python 3.12
          VIRTUAL_ENV=.venv-lerobot uv pip install --torch-backend=cpu "$SPEC" pytest pandas scipy av
          PYTHONPATH=packages/grabette-postprocess .venv-lerobot/bin/python -m pytest \
            packages/grabette-postprocess/tests/test_lerobot_api.py \
            packages/grabette-postprocess/tests/test_dataset_build.py -v

      - name: Chunk-relative processor tests
        # Lives in this job rather than the fast one because two of its five
        # test files import lerobot at module scope — they build the real
        # processor pipeline and assert the registered step round-trips. The
        # venv above already has lerobot, CPU torch and scipy, which is the
        # whole dependency set.
        #
        # This package supplies the chunk-relative action transform that the
        # pi0.5 checkpoints' preprocessors reference by registry name, so a
        # regression here breaks checkpoint loading rather than just a metric.
        run: |
          PYTHONPATH=packages/grabette-chunkrel .venv-lerobot/bin/python -m pytest \
            packages/grabette-chunkrel/tests -q
