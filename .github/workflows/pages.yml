name: Deploy getting-started page to Pages

# Publishes the Grabette getting-started page (docs/index.html + docs/media/) to
# https://pollen-robotics.github.io/grabette/ — the first-run walkthrough and
# the Bluetooth WiFi-provisioning client it leads into. The client has a device
# chooser, so the one site also provisions a Gripette or a Casquette. The
# per-package packages/*/docs/index.html are symlinks to docs/index.html, so
# this single source is the only thing to deploy.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# Least privilege for the Pages deploy: read the repo, mint the OIDC token,
# write the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; let an in-progress run finish (don't cancel) so a
# half-published site is never left live.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Stage only the getting-started page and its media. `docs/` also holds
      # the doc-builder sources for the Hugging Face documentation site, which
      # must not be published here.
      - run: |
          mkdir -p _site/images
          cp docs/index.html _site/
          cp -r docs/media _site/media
          # Just the images the page uses — docs/images/ is shared with the
          # READMEs and has no business being published wholesale.
          cp docs/images/grabette_logo_small.png docs/images/turn_on.gif _site/images/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
