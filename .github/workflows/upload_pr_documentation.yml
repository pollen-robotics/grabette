name: Upload PR Documentation

# Picks up the artifact from "Build HF PR Documentation", syncs it to the
# hf-doc-build bucket, and comments the preview URL on the PR:
#   https://moon-ci-docs.huggingface.co/docs/grabette/pr_<number>
# The preview stays up for 30 days after the last update.

on:
  workflow_run:
    workflows: ["Build HF PR Documentation"]
    types:
      - completed

jobs:
  build:
    uses: huggingface/doc-builder/.github/workflows/upload_pr_documentation.yml@main
    with:
      repo_owner: pollen-robotics
      package_name: grabette
    secrets:
      hf_token: ${{ secrets.HF_DOC_BUILD_PUSH }}
      comment_bot_token: ${{ secrets.COMMENT_BOT_TOKEN }}
